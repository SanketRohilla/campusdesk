{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="text-center text-white mb-4" style="animation: fadeInUp 0.4s ease both;">
            <h3 class="fw-bold mb-1">CampusDesk Service Portal</h3>
            <p class="text-white-50 small mb-0">University IT Support, Diagnostics & Lab Equipment Management</p>
        </div>

        <div class="card shadow-lg">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">Sign In</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login_post') }}">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your campus username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In to Portal</button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 small text-muted">
                New student or staff member? <a href="{{ url_for('register_get') }}" class="text-decoration-none fw-semibold">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
